<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling Footer Ad</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* 🎯 Ad container layout setup */
        .banner {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
        }

        /* 🔄 Infinite marquee rolling track - uses absolute % metrics for perfect loop matching */
        .rolling-track {
            display: flex;
            width: max-content;
            height: 100%;
            animation: rollMarquee 25s linear infinite;
        }

        /* Make each ad item exact size constraint */
        .ad-item {
            width: 100vw;
            max-width: 720px;
            height: 100%;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 🛠️ FIX 1: Prevent Lottie from swallowing clicks */
        .ad-item lottie-player {
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Allows clicks to bleed through directly to .ad-item container */
        }

        /* Pause rolling on hover */
        .banner:hover .rolling-track {
            animation-play-state: paused;
        }

        /* 🎞️ FIX 2: Translate exactly -50% of the combined track (since the back half is an identical duplicate) */
        @keyframes rollMarquee {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }
    </style>

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>

<body>

    <div class="banner">
        <div class="rolling-track">

            <div class="ad-item" onclick="handleAdClick()">
                <lottie-player src="./data1.json" background="transparent" speed="1" loop autoplay></lottie-player>
            </div>

            <div class="ad-item" onclick="handleAdClick()">
                <lottie-player src="./data2.json" background="transparent" speed="1" loop autoplay></lottie-player>
            </div>

            <div class="ad-item" onclick="handleAdClick()">
                <lottie-player src="./data3.json" background="transparent" speed="1" loop autoplay></lottie-player>
            </div>

        </div>
    </div>

</body>
<script>
    var clickTag = "https://www.google.com";

    // 🛠️ FIX 3: Safe tracking function handler
    function handleAdClick() {
        if (typeof clickTag !== 'undefined' && clickTag) {
            window.open(clickTag, '_blank');
        }
    }

    // Automatically clones items to ensure a seamless infinite seamless layout wrap
    window.addEventListener('DOMContentLoaded', () => {
        const track = document.querySelector('.rolling-track');
        const items = Array.from(track.children);

        // Clone each item and append to the back of the track
        items.forEach(item => {
            const clone = item.cloneNode(true);

            // Re-bind the click action cleanly onto the cloned DOM element nodes
            clone.setAttribute('onclick', 'handleAdClick()');
            track.appendChild(clone);
        });
    });
</script>

</html>
