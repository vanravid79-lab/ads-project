<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie 300x600 Ad</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .banner {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        lottie-player {
            width: 100%;
            height: 100%;
        }
    </style>

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <script>
        var clickTag = "https://www.google.com";
    </script>
</head>

<body>

    <div class="banner" onclick="window.open(clickTag, '_blank')">
        <lottie-player src="data12.json" background="transparent" speed="1" loop autoplay>
        </lottie-player>
    </div>

</body>

</html>
