<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie Ad Layers</title>

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        .banner {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        lottie-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #myCans {
            z-index: 2;
            display: block;
            object-fit: contain;
        }

        #myTallBanner1 {
            z-index: 1;
            display: none;
            object-fit: cover;
        }
    </style>
    <script>
        var clickTag = "https://www.google.com";
    </script>
</head>

<body>

    <div class="banner" id="adBanner">
        <lottie-player id="myCans" src="./data5.json" background="transparent" speed="1" loop autoplay>
        </lottie-player>

        <lottie-player id="myTallBanner1" src="./data4.json" background="transparent" speed="1" loop autoplay>
        </lottie-player>
    </div>

    <script>
        const cans = document.getElementById("myCans");
        const tall1 = document.getElementById("myTallBanner1");
        const banner = document.getElementById("adBanner");

        // Click logic for the floating small cans
        cans.addEventListener("click", (e) => {
            e.stopPropagation();
            window.parent.postMessage("expandAd", "*");
            cans.style.display = "none";
            tall1.style.display = "block";
        });

        // Click logic for landing page redirect on full ad
        banner.addEventListener("click", () => {
            if (tall1.style.display === "block") {
                window.open(clickTag, '_blank');
            }
        });
    </script>
</body>

</html>
